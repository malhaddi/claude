<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulateur de trajectoire de fusée</title>
  <style>
    html, body { margin: 0; background: #05070e; }
  </style>
</head>
<body>
<style>
  :root {
    --bg:      #05070e;
    --panel:   #0d1524;
    --line:    #1f2d47;
    --ink:     #e7ecf7;
    --muted:   #8593b3;
    --cyan:    #46e6d2;
    --amber:   #ff7a3c;
    --amber-2: #ffb347;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  .app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- top-left brand + live telemetry ---------- */
  .brand {
    position: absolute; top: 12px; left: 14px;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.7);
  }
  .brand .eyebrow {
    margin: 0;
    font-family: var(--font-mono);
    font-size: .64rem;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--amber);
    display: flex; align-items: center; gap: 8px;
  }
  .brand .eyebrow::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 10px var(--amber);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  .brand h1 { margin: 3px 0 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }

  .hud { position: absolute; top: 52px; left: 14px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .chip {
    font-family: var(--font-mono); font-size: .72rem;
    background: rgba(8,14,26,.66); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 8px; backdrop-filter: blur(6px);
    display: flex; gap: 7px; align-items: baseline; width: max-content;
  }
  .chip .k { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: .6rem; }
  .chip .v { color: var(--cyan); font-variant-numeric: tabular-nums; }

  /* ---------- bottom bar: results + controls ---------- */
  .bottombar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 8px; }
  .stat {
    font-family: var(--font-mono); font-size: .72rem;
    background: rgba(8,14,26,.72); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 9px; backdrop-filter: blur(6px);
    display: flex; gap: 7px; align-items: baseline;
  }
  .stat .l { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .58rem; }
  .stat .n { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .stat .n .u { color: var(--muted); font-size: .62rem; margin-left: 2px; }
  .stat.impact .n { color: var(--amber-2); }

  .dock {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px;
    padding: 12px 14px 14px;
    background: rgba(8,12,22,.86);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .dg { display: flex; flex-direction: column; gap: 7px; }
  .dg-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dg-label { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-family: var(--font-mono); }

  .numbox {
    display: inline-flex; align-items: baseline; gap: 4px;
    background: rgba(255,122,60,.10); border: 1px solid rgba(255,122,60,.30);
    border-radius: 7px; padding: 3px 8px; transition: .15s;
  }
  .numbox:focus-within { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(255,122,60,.25); }
  .numin {
    width: 42px; background: transparent; border: none; outline: none;
    color: var(--amber-2); font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: .9rem; text-align: right; padding: 0; -moz-appearance: textfield;
  }
  .numin::-webkit-outer-spin-button, .numin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .numbox .unit { font-family: var(--font-mono); font-size: .7rem; color: var(--muted); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 160px; height: 4px;
    border-radius: 4px; background: var(--line); outline: none; accent-color: var(--amber);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber); border: 3px solid #1a1206;
    box-shadow: 0 0 0 1px var(--amber), 0 0 10px rgba(255,122,60,.6); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--amber);
    border: 3px solid #1a1206; cursor: pointer;
  }
  input[type="range"]:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }

  .sel {
    font-family: var(--font-mono); font-size: .8rem;
    background: rgba(255,255,255,.04); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  .sel:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }

  .dg-actions { flex-direction: row; align-items: center; gap: 10px; margin-left: auto; }
  .btn {
    font-family: var(--font-ui); font-weight: 600; font-size: .9rem;
    padding: 10px 16px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; transition: .15s;
    white-space: nowrap;
  }
  .btn-launch { background: linear-gradient(180deg, var(--amber-2), var(--amber)); color: #22140a; box-shadow: 0 6px 18px rgba(255,122,60,.28); }
  .btn-launch:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .btn-launch:active { transform: translateY(0); }
  .btn-reset { background: transparent; border-color: var(--line); color: var(--muted); }
  .btn-reset:hover { border-color: var(--muted); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  @media (max-width: 520px) {
    .dg-actions { margin-left: 0; width: 100%; }
    .dg-actions .btn-launch { flex: 1; }
    input[type="range"] { width: 132px; }
  }
</style>

<div class="app">
  <canvas id="stage"></canvas>

  <div class="brand">
    <p class="eyebrow">Contrôle de mission</p>
    <h1>Trajectoire de fusée</h1>
  </div>

  <div class="hud">
    <div class="chip"><span class="k">Alt</span><span class="v" id="hudAlt">0 m</span></div>
    <div class="chip"><span class="k">Vit</span><span class="v" id="hudVel">0 m/s</span></div>
    <div class="chip"><span class="k">Dist</span><span class="v" id="hudDist">0 m</span></div>
  </div>

  <div class="bottombar" id="bottombar">
    <div class="stats">
      <div class="stat impact"><span class="l">Portée</span><span class="n"><span id="rRange">—</span><span class="u">m</span></span></div>
      <div class="stat"><span class="l">Alt. max</span><span class="n"><span id="rApex">—</span><span class="u">m</span></span></div>
      <div class="stat"><span class="l">Temps</span><span class="n"><span id="rTime">—</span><span class="u">s</span></span></div>
      <div class="stat"><span class="l">V. impact</span><span class="n"><span id="rImp">—</span><span class="u">m/s</span></span></div>
    </div>

    <div class="dock">
      <div class="dg">
        <div class="dg-top">
          <span class="dg-label">Angle de tir</span>
          <span class="numbox"><input class="numin" type="number" id="angleNum" min="5" max="85" step="1" value="45" inputmode="numeric" aria-label="Angle en degrés"><span class="unit">°</span></span>
        </div>
        <input type="range" id="angle" min="5" max="85" step="1" value="45" aria-label="Angle de tir">
      </div>

      <div class="dg">
        <div class="dg-top">
          <span class="dg-label">Vitesse</span>
          <span class="numbox"><input class="numin" type="number" id="speedNum" min="10" max="150" step="1" value="60" inputmode="numeric" aria-label="Vitesse en mètres par seconde"><span class="unit">m/s</span></span>
        </div>
        <input type="range" id="speed" min="10" max="150" step="1" value="60" aria-label="Vitesse initiale">
      </div>

      <div class="dg">
        <span class="dg-label">Gravité</span>
        <select class="sel" id="planet" aria-label="Gravité de la planète">
          <option value="9.81">Terre — 9.81 m/s²</option>
          <option value="1.62">Lune — 1.62 m/s²</option>
          <option value="3.71">Mars — 3.71 m/s²</option>
          <option value="24.79">Jupiter — 24.79 m/s²</option>
        </select>
      </div>

      <div class="dg dg-actions">
        <button class="btn btn-launch" id="launch">🚀 Lancer</button>
        <button class="btn btn-reset" id="reset">Réinit.</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const canvas = $("stage");
  const ctx = canvas.getContext("2d");
  const bottombar = $("bottombar");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const els = {
    angle: $("angle"), speed: $("speed"),
    angleNum: $("angleNum"), speedNum: $("speedNum"),
    hudAlt: $("hudAlt"), hudVel: $("hudVel"), hudDist: $("hudDist"),
    rRange: $("rRange"), rApex: $("rApex"), rTime: $("rTime"), rImp: $("rImp"),
  };

  const state = {
    angle: 45, speed: 60, g: 9.81,
    vx: 0, vy0: 0, T: 0, range: 0, apex: 0,
    t: 0, flying: false, finished: false,
    animStart: 0, animDur: 0, burstStart: -1,
    stars: [],
  };
  for (let i = 0; i < 90; i++) {
    state.stars.push({ x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.6 + 0.2 });
  }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ---- physics ----
  function recompute() {
    const rad = state.angle * Math.PI / 180, v = state.speed, g = state.g;
    state.vx = v * Math.cos(rad);
    state.vy0 = v * Math.sin(rad);
    state.T = (2 * state.vy0) / g;
    state.range = (v * v * Math.sin(2 * rad)) / g;
    state.apex = (state.vy0 * state.vy0) / (2 * g);
  }
  const posX = (t) => state.vx * t;
  const posY = (t) => state.vy0 * t - 0.5 * state.g * t * t;
  const velAt = (t) => Math.hypot(state.vx, state.vy0 - state.g * t);

  function niceStep(raw) {
    if (raw <= 0 || !isFinite(raw)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  const fmt = (n) => Math.abs(n) >= 100 ? Math.round(n).toLocaleString("fr-FR")
                   : Math.abs(n) >= 10 ? n.toFixed(0) : n.toFixed(1);

  // ---- world <-> screen ----
  function frame() {
    const padL = 46, padR = 24, padT = 24;
    const padB = (bottombar ? bottombar.offsetHeight : 90) + 12;
    const groundY = H - padB;
    const worldW = Math.max(state.range, 1), worldH = Math.max(state.apex, 1);
    const scale = Math.min((W - padL - padR) / worldW, Math.max(groundY - padT, 20) / worldH);
    return { groundY, padL, scale, sx: (x) => padL + x * scale, sy: (y) => groundY - y * scale };
  }

  // ---- drawing ----
  function draw() {
    if (!W || !H) return;
    const f = frame();

    const sky = ctx.createLinearGradient(0, 0, 0, f.groundY);
    sky.addColorStop(0, "#05070f"); sky.addColorStop(0.7, "#0a1120"); sky.addColorStop(1, "#111d33");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    for (const s of state.stars) {
      ctx.globalAlpha = s.a; ctx.fillStyle = "#cfe3ff";
      ctx.beginPath(); ctx.arc(s.x * W, s.y * f.groundY, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const glow = ctx.createRadialGradient(W - 60, f.groundY, 8, W - 60, f.groundY, 220);
    glow.addColorStop(0, "rgba(255,122,60,.16)"); glow.addColorStop(1, "rgba(255,122,60,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    drawGrid(f);

    ctx.fillStyle = "#0c1526"; ctx.fillRect(0, f.groundY, W, H - f.groundY);
    ctx.strokeStyle = "rgba(70,230,210,.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, f.groundY + 0.5); ctx.lineTo(W, f.groundY + 0.5); ctx.stroke();

    drawPad(f);

    if (state.range > 0.5) {
      ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = "rgba(70,230,210,.28)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 120; i++) {
        const t = (i / 120) * state.T, X = f.sx(posX(t)), Y = f.sy(Math.max(posY(t), 0));
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke(); ctx.restore();
    }

    const tNow = Math.min(state.t, state.T);
    if ((state.flying || state.finished) && tNow > 0) {
      ctx.save(); ctx.strokeStyle = "#46e6d2"; ctx.lineWidth = 2.4;
      ctx.shadowColor = "rgba(70,230,210,.7)"; ctx.shadowBlur = 8;
      ctx.beginPath();
      const steps = 90;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * tNow, X = f.sx(posX(t)), Y = f.sy(Math.max(posY(t), 0));
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke(); ctx.restore();
    }

    if (state.finished) drawImpact(f);

    if (state.flying && state.t < state.T) {
      const t = state.t, X = f.sx(posX(t)), Y = f.sy(posY(t));
      const rot = Math.atan2(-(state.vy0 - state.g * t), state.vx);
      drawRocket(X, Y, rot, true);
    } else if (!state.flying && !state.finished) {
      drawRocket(f.sx(0), f.groundY - 12, -state.angle * Math.PI / 180, false);
    }

    updateHud();
  }

  function drawGrid(f) {
    ctx.font = "10px " + getComputedStyle(document.body).getPropertyValue("--font-mono");
    const stepX = niceStep(Math.max(state.range, 1) / 6);
    ctx.lineWidth = 1;
    for (let x = 0; x <= state.range * 1.02 + stepX; x += stepX) {
      const X = f.sx(x);
      if (X > W - 10) break;
      ctx.strokeStyle = "rgba(120,140,180,.10)";
      ctx.beginPath(); ctx.moveTo(X, 20); ctx.lineTo(X, f.groundY); ctx.stroke();
      ctx.fillStyle = "rgba(133,147,179,.7)"; ctx.textAlign = "center";
      ctx.fillText(fmt(x), X, f.groundY + 14);
    }
    const stepY = niceStep(Math.max(state.apex, 1) / 4);
    for (let y = stepY; y <= state.apex * 1.05 + stepY; y += stepY) {
      const Y = f.sy(y);
      if (Y < 18) break;
      ctx.strokeStyle = "rgba(120,140,180,.08)";
      ctx.beginPath(); ctx.moveTo(38, Y); ctx.lineTo(W, Y); ctx.stroke();
      ctx.fillStyle = "rgba(133,147,179,.6)"; ctx.textAlign = "left";
      ctx.fillText(fmt(y), 4, Y + 3);
    }
  }

  function drawPad(f) {
    const x = f.sx(0), y = f.groundY;
    ctx.fillStyle = "#26364f";
    ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x - 9, y - 9); ctx.lineTo(x + 9, y - 9); ctx.lineTo(x + 14, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#3a4d6b"; ctx.fillRect(x - 12, y - 3, 24, 3);
  }

  function drawRocket(x, y, rot, thrusting) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (thrusting) {
      const flick = 10 + Math.random() * 10;
      const fl = ctx.createLinearGradient(-11, 0, -11 - flick, 0);
      fl.addColorStop(0, "rgba(255,220,120,.95)"); fl.addColorStop(0.5, "rgba(255,122,60,.85)"); fl.addColorStop(1, "rgba(255,60,20,0)");
      ctx.fillStyle = fl;
      ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(-11 - flick, 0); ctx.lineTo(-10, 4); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#ff7a3c";
    ctx.beginPath(); ctx.moveTo(-8, -3.5); ctx.lineTo(-13, -8); ctx.lineTo(-8, -1.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8, 3.5); ctx.lineTo(-13, 8); ctx.lineTo(-8, 1.5); ctx.closePath(); ctx.fill();
    const body = ctx.createLinearGradient(0, -5, 0, 5);
    body.addColorStop(0, "#f4f7ff"); body.addColorStop(0.5, "#cdd6e6"); body.addColorStop(1, "#93a0b8");
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(8, -5); ctx.quadraticCurveTo(16, 0, 8, 5); ctx.lineTo(-10, 5); ctx.quadraticCurveTo(-13, 0, -10, -5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff7a3c";
    ctx.beginPath(); ctx.moveTo(8, -5); ctx.quadraticCurveTo(16, 0, 8, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#46e6d2";
    ctx.beginPath(); ctx.arc(-1, 0, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawImpact(f) {
    const x = f.sx(state.range), y = f.groundY;
    ctx.save(); ctx.setLineDash([3, 5]); ctx.strokeStyle = "rgba(255,122,60,.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 24); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();

    if (state.burstStart >= 0) {
      const dt = (performance.now() - state.burstStart) / 700;
      if (dt < 1) {
        ctx.save(); ctx.globalAlpha = 1 - dt; ctx.strokeStyle = "#ffb347"; ctx.lineWidth = 3 * (1 - dt) + 0.5;
        ctx.beginPath(); ctx.arc(x, y, 6 + dt * 34, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
    }
    ctx.fillStyle = "#ff7a3c"; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffb347"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y - 6); ctx.stroke();

    const label = "IMPACT · " + fmt(state.range) + " m";
    ctx.font = "600 11px " + getComputedStyle(document.body).getPropertyValue("--font-mono");
    const w = ctx.measureText(label).width + 16;
    let bx = Math.max(4, Math.min(x - w / 2, W - w - 4));
    const by = y - 30;
    ctx.fillStyle = "rgba(255,122,60,.16)"; ctx.strokeStyle = "rgba(255,122,60,.6)"; ctx.lineWidth = 1;
    roundRect(bx, by, w, 20, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffb347"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, bx + w / 2, by + 10.5); ctx.textBaseline = "alphabetic";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function updateHud() {
    let alt = 0, vel = state.speed, dist = 0;
    if (state.flying && state.t <= state.T) { alt = Math.max(posY(state.t), 0); vel = velAt(state.t); dist = posX(state.t); }
    else if (state.finished) { alt = 0; vel = state.speed; dist = state.range; }
    els.hudAlt.textContent = fmt(alt) + " m";
    els.hudVel.textContent = fmt(vel) + " m/s";
    els.hudDist.textContent = fmt(dist) + " m";
  }

  function showResults() {
    els.rRange.textContent = fmt(state.range);
    els.rApex.textContent = fmt(state.apex);
    els.rTime.textContent = state.T.toFixed(1);
    els.rImp.textContent = fmt(state.speed);
  }
  function clearResults() {
    els.rRange.textContent = els.rApex.textContent = els.rTime.textContent = els.rImp.textContent = "—";
  }

  // ---- animation ----
  let raf = 0;
  function launch() {
    recompute();
    if (state.range < 0.5) return;
    cancelAnimationFrame(raf);
    state.flying = true; state.finished = false; state.t = 0; state.burstStart = -1;
    state.animDur = Math.min(Math.max(state.T * 0.35, 1.6), 4) * 1000;
    if (reduceMotion) {
      state.t = state.T; state.flying = false; state.finished = true;
      showResults(); draw(); return;
    }
    state.animStart = performance.now();
    raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    const p = (now - state.animStart) / state.animDur;
    state.t = Math.min(p, 1) * state.T;
    draw();
    if (p < 1) { raf = requestAnimationFrame(tick); }
    else {
      state.flying = false; state.finished = true; state.t = state.T;
      state.burstStart = performance.now(); showResults(); draw();
      raf = requestAnimationFrame(function fade(n) { draw(); if (n - state.burstStart < 720) raf = requestAnimationFrame(fade); });
    }
  }
  function reset() {
    cancelAnimationFrame(raf);
    state.flying = false; state.finished = false; state.t = 0; state.burstStart = -1;
    clearResults(); recompute(); draw();
  }

  // ---- input wiring ----
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function applyAngle(a, writeNum) {
    a = clamp(Math.round(a), 5, 85); state.angle = a; els.angle.value = a;
    if (writeNum) els.angleNum.value = a;
    if (!state.flying) reset();
  }
  function applySpeed(v, writeNum) {
    v = clamp(Math.round(v), 10, 150); state.speed = v; els.speed.value = v;
    if (writeNum) els.speedNum.value = v;
    if (!state.flying) reset();
  }
  els.angle.addEventListener("input", () => applyAngle(+els.angle.value, true));
  els.speed.addEventListener("input", () => applySpeed(+els.speed.value, true));
  els.angleNum.addEventListener("input", () => { const v = parseFloat(els.angleNum.value); if (!isNaN(v)) applyAngle(v, false); });
  els.speedNum.addEventListener("input", () => { const v = parseFloat(els.speedNum.value); if (!isNaN(v)) applySpeed(v, false); });
  els.angleNum.addEventListener("change", () => applyAngle(parseFloat(els.angleNum.value) || 45, true));
  els.speedNum.addEventListener("change", () => applySpeed(parseFloat(els.speedNum.value) || 60, true));

  $("planet").addEventListener("change", (e) => { state.g = +e.target.value; if (!state.flying) reset(); });
  $("launch").addEventListener("click", launch);
  $("reset").addEventListener("click", reset);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); launch(); }
  });

  new ResizeObserver(resize).observe(canvas);
  new ResizeObserver(draw).observe(bottombar);

  recompute();
  requestAnimationFrame(resize);
})();
</script>
</body>
</html>
