name: Import photos

# Télécharge des photos depuis des URLs publiques et les commit dans
# dar-michele-djerba/photos/ — utilisé parce que l'environnement Claude
# n'a pas d'accès web sortant, alors que les runners GitHub en ont un.
on:
  workflow_dispatch:
    inputs:
      mapping:
        description: 'JSON {"nom-fichier.jpg":"https://url-directe", ...} téléchargé dans dar-michele-djerba/photos/'
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download photos
        env:
          MAPPING: ${{ inputs.mapping }}
        run: |
          mkdir -p dar-michele-djerba/photos
          printf '%s' "$MAPPING" | python3 -c '
          import json, sys, os, urllib.request
          mapping = json.load(sys.stdin)
          for name, url in mapping.items():
              name = os.path.basename(name)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (photo-import)"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
              assert data[:3] in (b"\xff\xd8\xff", b"\x89PN", b"RIF", b"GIF"), f"{name}: not an image ({data[:12]!r})"
              with open(os.path.join("dar-michele-djerba/photos", name), "wb") as f:
                  f.write(data)
              print("ok", name, len(data), "bytes")
          '

      - name: Commit and push
        run: |
          git config user.name "photo-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dar-michele-djerba/photos
          git commit -m "Import property photos via workflow" || echo "nothing to commit"
          git push
