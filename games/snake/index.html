<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake 🐍</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1c33;
    --grid: #22253f;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #f472b6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #818cf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1c1f3a 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 16px;
    width: 100%;
    max-width: 460px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .scores {
    display: flex;
    gap: 18px;
    font-variant-numeric: tabular-nums;
  }
  .score-box { text-align: right; }
  .score-box .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .score-box .value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 16, 32, 0.82);
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 24px;
    transition: opacity 0.2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 1.6rem; }
  .overlay p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .btn {
    margin-top: 6px;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
  .hint {
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
    line-height: 1.6;
  }
  .hint kbd {
    background: var(--grid);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.72rem;
    border: 1px solid rgba(255,255,255,0.08);
  }
  @media (max-width: 480px) {
    .hint .desktop-only { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🐍 Snake</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">Record</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Snake 🐍</h2>
        <p id="ov-text">Mange les pommes, grandis, évite les murs et ta queue.</p>
        <button class="btn" id="startBtn">Jouer</button>
      </div>
    </div>

    <div class="hint">
      <span class="desktop-only"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> pour bouger · <kbd>Espace</kbd> pause<br></span>
      Sur mobile : glisse le doigt dans la direction voulue.
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;                 // cells per side
  const CELL = canvas.width / GRID; // pixel size of a cell
  const START_SPEED = 140;         // ms per step
  const MIN_SPEED = 70;            // fastest step interval

  let snake, dir, nextDir, food, score, best, speed, running, paused, loopId;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, START_SPEED - score * 3);
      placeFood();
      restartLoop();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(() => { if (!paused) step(); }, speed);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function draw() {
    // background grid
    ctx.fillStyle = '#1a1c33';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // food (pulsing dot)
    const fx = food.x * CELL, fy = food.y * CELL;
    ctx.fillStyle = '#f472b6';
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 12;
    roundRect(fx + CELL * 0.15, fy + CELL * 0.15, CELL * 0.7, CELL * 0.7, CELL * 0.35);
    ctx.shadowBlur = 0;

    // snake
    snake.forEach((s, i) => {
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#86efac' : '#4ade80';
      const pad = isHead ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      if (isHead) {
        // eyes
        ctx.fillStyle = '#0f1020';
        const ex = s.x * CELL, ey = s.y * CELL;
        const eyeR = CELL * 0.09;
        const offA = CELL * 0.3, offB = CELL * 0.7;
        let e1, e2;
        if (dir.x === 1)      { e1 = [offB, offA]; e2 = [offB, offB]; }
        else if (dir.x === -1){ e1 = [offA, offA]; e2 = [offA, offB]; }
        else if (dir.y === -1){ e1 = [offA, offA]; e2 = [offB, offA]; }
        else                  { e1 = [offA, offB]; e2 = [offB, offB]; }
        ctx.beginPath(); ctx.arc(ex + e1[0], ey + e1[1], eyeR, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + e2[0], ey + e2[1], eyeR, 0, 7); ctx.fill();
      }
    });
  }

  function gameOver() {
    clearInterval(loopId);
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'Game Over 💀';
    ovText.innerHTML = `Score : <b>${score}</b>${score >= best && score > 0 ? ' — nouveau record ! 🎉' : ''}`;
    startBtn.textContent = 'Rejouer';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    draw();
    restartLoop();
  }

  function setDir(x, y) {
    // prevent reversing directly into itself
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = 'Pause ⏸';
      ovText.textContent = 'Appuie sur Espace ou le bouton pour reprendre.';
      startBtn.textContent = 'Reprendre';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  // keyboard
  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': case 'z': case 'Z': setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': case 'q': case 'Q': setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
      case ' ':
        e.preventDefault();
        if (!running) start(); else togglePause();
        break;
      default: return;
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  });

  // touch / swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', () => {
    if (paused) togglePause(); else start();
  });

  // initial paint
  reset();
  draw();
  overlay.classList.remove('hidden');
})();
</script>
</body>
</html>
